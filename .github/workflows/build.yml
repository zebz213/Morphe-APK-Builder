name: Build APKs
on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true

  workflow_dispatch:

concurrency:
  group: morphe-apk-builder-build
  cancel-in-progress: false

jobs:
  run:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Install signing keys
        env:
          KS_P12_B64: ${{ secrets.KEYSTORE_P12_B64 }}
          KS_BKS_B64: ${{ secrets.KEYSTORE_BKS_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -z "$KS_P12_B64" ] || [ -z "$KS_BKS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Signing key secrets are missing (KEYSTORE_P12_B64, KEYSTORE_BKS_B64, KEYSTORE_PASS)"
            exit 1
          fi
          printf '%s' "$KS_P12_B64" | base64 -d > ks-p12.keystore
          printf '%s' "$KS_BKS_B64" | base64 -d > ks.keystore
          chmod 600 ks-p12.keystore ks.keystore
          {
            echo "KS_STORE_PASS=$KS_PASS"
            echo "KS_KEY_PASS=$KS_PASS"
            echo "KS_ALIAS=$KS_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Update config
        if: ${{ inputs.from_ci }}
        run: |
          if git checkout origin/update build.md; then
            UPDATE_CFG=$(./build.sh config.toml --config-update)
            if [ "$UPDATE_CFG" ]; then
              echo "'$UPDATE_CFG'"
              echo "$UPDATE_CFG" > config.json
            fi
          fi

      - name: Get next version code
        id: next_ver_code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list -L 1 | awk -F '\t' '{print $3}')
          if [ -z "$TAG" ]; then TAG=0; fi
          echo "NEXT_VER_CODE=$((TAG + 1))" >> $GITHUB_OUTPUT

      - name: Build APKs
        run: if [ -f "config.json" ]; then ./build.sh config.json; else ./build.sh config.toml; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: $GITHUB_REPOSITORY
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}

      - name: Get output
        id: get_output
        run: |
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat build.md >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
          cp -f build.md build.tmp
      
      - name: Upload release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          BODY: ${{ steps.get_output.outputs.BUILD_LOG }}
        run: |
          if ! compgen -G "./build/*" >/dev/null; then
            echo "No APKs were produced; skipping release creation."
            exit 0
          fi
          LATEST=$(gh release list -L1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          if [ -n "$LATEST" ]; then
            HAVE=$(gh release view "$LATEST" --json assets --jq '.assets[].name')
            NEW_ONLY=0
            for f in ./build/*; do
              grep -qxF "$(basename "$f")" <<<"$HAVE" || NEW_ONLY=1
            done
            if [ "$NEW_ONLY" = 0 ]; then
              echo "Every built APK is already in release $LATEST; skipping release creation."
              exit 0
            fi
          fi
          ls -lh ./build/*
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Release" --notes "$BODY"
            gh release upload "$TAG" ./build/* --clobber
          else
            gh release create "$TAG" ./build/* --title "Release" --notes "$BODY"
          fi

      - name: Update build log branch
        id: update_config
        run: |
          git checkout -f update || git switch --discard-changes --orphan update
          cp -f build.tmp build.md
          cp -f temp/failed failed_prev 2>/dev/null || : >failed_prev

      - name: Commit build log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          git add build.md failed_prev
      
          if ! git diff --cached --quiet; then
            git commit -m "Bump version ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"
            git push origin HEAD:update
          else
            echo "no changes!"
          fi

      - name: Fail if any app failed
        run: |
          if [ -s temp/failed ]; then
            echo "::error::These apps failed to build: $(tr '\n' ' ' < temp/failed)"
            exit 1
          fi

      - name: Report to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        if: env.TG_TOKEN != null
        run: |
          cd build || { echo "build folder not found"; exit 1; }

          TG_CHAT="@rvc_magisk"
          NL=$'\n'
          APKS=""
          MODULES=""
          for OUTPUT in *; do
            DL_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            if [[ $OUTPUT = *.apk ]]; then
              APKS+="${NL}📦[${OUTPUT}](${DL_URL})"
            elif [[ $OUTPUT = *.zip ]]; then
              MODULES+="${NL}📦[${OUTPUT}](${DL_URL})"
            fi
          done
          if [ -n "$MODULES" ]; then
            MODULES="Modules:${NL}${MODULES#"$NL"}"
            if [ -n "$APKS" ]; then MODULES+=${NL}${NL}; fi
          fi
          if [ -n "$APKS" ]; then APKS="APKs:${NL}${APKS#"$NL"}"; fi

          BODY="$(cat ../build.md)"
          MSG="*New build!*

          ${BODY}

          *▼ Download Links:*
          ${MODULES}${APKS}
          "
          echo "'$MSG'"
          MSG=${MSG:0:9450}
          POST="https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
          curl -X POST --data-urlencode "parse_mode=Markdown" --data-urlencode "disable_web_page_preview=true" --data-urlencode "text=${MSG}" --data-urlencode "chat_id=${TG_CHAT}" "$POST"
